name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip source (if uploaded as ZIP)
        run: |
          if [ -f FoodDiary-src.zip ]; then unzip -o -q FoodDiary-src.zip -d . ; fi
          ls -la
      - name: Download OCR language files (Hebrew + English)
        run: |
          mkdir -p app/src/main/assets/tessdata
          curl -fsSL -o app/src/main/assets/tessdata/heb.traineddata https://github.com/tesseract-ocr/tessdata_fast/raw/main/heb.traineddata
          curl -fsSL -o app/src/main/assets/tessdata/eng.traineddata https://github.com/tesseract-ocr/tessdata_fast/raw/main/eng.traineddata
          ls -la app/src/main/assets/tessdata
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Restore the app's signing key
        uses: actions/cache@v4
        with:
          path: signing
          key: fooddiary-signing-key-v1
      - name: Create the signing key (first build only)
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          mkdir -p signing
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > signing/fooddiary.keystore
          elif [ ! -f signing/fooddiary.keystore ]; then
            keytool -genkeypair -keystore signing/fooddiary.keystore -alias fooddiary -keyalg RSA -keysize 2048 \
              -validity 12000 -storepass fooddiary -keypass fooddiary -dname "CN=FoodDiary"
          fi
          keytool -list -keystore signing/fooddiary.keystore -storepass fooddiary | grep -i fingerprint || true
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace
          cp app/build/outputs/apk/release/app-release.apk FoodDiary.apk
      - uses: actions/upload-artifact@v4
        with:
          name: FoodDiary-APK
          path: FoodDiary.apk
      # gh instead of a release action: uploads only the file, so a hiccup in other release calls can't fail the build
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest >/dev/null 2>&1 || gh release create latest --title "FoodDiary (latest build)" --notes "אנדרואיד: FoodDiary.apk. מחשב (Windows): FoodDiary.exe." --latest
          for i in 1 2 3; do gh release upload latest FoodDiary.apk --clobber && exit 0; sleep 15; done; exit 1
