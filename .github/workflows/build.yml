name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip source (if uploaded as ZIP)
        run: |
          if [ -f FoodDiary-src.zip ]; then unzip -o -q FoodDiary-src.zip -d . ; fi
          ls -la
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace
          cp app/build/outputs/apk/release/app-release.apk FoodDiary.apk
      - uses: actions/upload-artifact@v4
        with:
          name: FoodDiary-APK
          path: FoodDiary.apk
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: FoodDiary (latest build)
          body: "מורידים את FoodDiary.apk ומתקינים בטלפון."
          files: FoodDiary.apk
          make_latest: true
