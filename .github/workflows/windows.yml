name: Build Windows app

on:
  push:
    paths:
      - 'app/src/main/assets/www/**'
      - 'desktop/**'
      - '.github/workflows/windows.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build FoodDiary.exe
        working-directory: desktop
        run: npx --yes @tauri-apps/cli@2 build --no-bundle
      - name: Collect
        shell: pwsh
        run: |
          Copy-Item desktop/src-tauri/target/release/fooddiary.exe FoodDiary.exe
          Get-Item FoodDiary.exe | Select-Object Name, Length
      - uses: actions/upload-artifact@v4
        with:
          name: FoodDiary-Windows
          path: FoodDiary.exe
      # gh instead of a release action: uploads only the file
      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest >/dev/null 2>&1 || gh release create latest --title "FoodDiary (latest build)" --notes "אנדרואיד: FoodDiary.apk. מחשב (Windows): FoodDiary.exe." --latest
          for i in 1 2 3; do gh release upload latest FoodDiary.exe --clobber && exit 0; sleep 15; done; exit 1
